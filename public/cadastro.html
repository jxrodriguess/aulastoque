<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>tela_cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="esquerda">
        <img src="senac.png" width="500px">
    </div>
    <div class="direita">
        <img src="download.png" class="logo1">
        <div class="login_completo">
            <div class="login">
                <h1><Strong>Cadastro</Strong></h1>
                <p>Faça seu cadastro</p>
            </div>
            <input type="text" placeholder="Nome:" class="campos">
            <input type="text" placeholder="CPF:" class="campos">
            <input type="text" placeholder="Email:" class="campos">
            <select name="Tipo:" class="campos">
                <option value=""disabled selected hidden>Tipo:</option>
                <option value="Administrador">Administrador</option>
                <option value="Docente/Professor">Docente/Professor</option>
            </select>
            <input type="text" placeholder="Matricula:" class="campos">
            <div class="botao">
                <button>Cadastrar</button>
            </div>
        </div>
    </div>
</body>

</html>
