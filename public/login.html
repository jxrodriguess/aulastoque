<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>tela_login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="esquerda">
        <img src="senac.png" width="500px">
    </div>
    <div class="direita">
        <img src="download.png" class="logo1">
        <div class="login_completo">
            <div class="login">
                <h1><Strong>Login</Strong></h1>
                <p>Faça login para continuar</p>
            </div>
            <h4>Matricula</h4>
                <input type="text" placeholder="N. da Matricula" class="campos">
                <h4>Pin</h4>
                    <input type="password" placeholder="Pin (Ex: 12345)" class="campos">
                    <label>
                        <input type="checkbox" name="lembrar">
                        Lembrar minha senha
                    </label>
                    <div class="botao">
                        <button>Entrar</button>
                    </div>
        </div>
    </div>
</body>

</html>
